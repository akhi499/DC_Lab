syntax = "proto3";

package inventory;

service InventoryService {
  rpc CheckStock (ProductRequest) returns (StockResponse);
  rpc ReserveStock (ProductRequest) returns (ReserveResponse);
  rpc UpdateStock (UpdateStockRequest) returns (UpdateStockResponse);
}

message ProductRequest {
  string product_id = 1;
  int32 quantity = 2;
  int64 lamport_timestamp = 3;
}

message StockResponse {
  bool available = 1;
  int32 current_stock = 2;
  string message = 3;
  int64 lamport_timestamp = 4;
}

message ReserveResponse {
  bool success = 1;
  int32 remaining_stock = 2;
  string message = 3;
  int64 lamport_timestamp = 4;
}

message UpdateStockRequest {
  string product_id = 1;
  int32 quantity_change = 2;
  int64 lamport_timestamp = 3;
}

message UpdateStockResponse {
  bool success = 1;
  int32 updated_stock = 2;
  string message = 3;
  int64 lamport_timestamp = 4;
}