<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini gRPC Shop Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f5f7fb;
      color: #1f2937;
    }
    .card {
      max-width: 520px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }
    h1 {
      margin-top: 0;
    }
    label, select, input, button {
      display: block;
      width: 100%;
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    select, input, button {
      padding: 0.75rem;
    }
    button {
      border: none;
      border-radius: 8px;
      background: #0f766e;
      color: #ffffff;
      cursor: pointer;
    }
    pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mini Shop Order Demo</h1>
    <p>This Flask app calls a gRPC inventory service before confirming an order.</p>

    <form id="order-form">
      <label for="product_id">Product</label>
      <select id="product_id" name="product_id">
        {% for product in products %}
        <option value="{{ product.id }}">{{ product.label }} (sample stock: {{ product.stock_hint }})</option>
        {% endfor %}
      </select>

      <label for="quantity">Quantity</label>
      <input id="quantity" name="quantity" type="number" min="1" value="1">

      <button type="submit">Place Order</button>
    </form>

    <pre id="result">Run the inventory server first, then place an order.</pre>
  </div>

  <script>
    const form = document.getElementById("order-form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const response = await fetch("/order", {
        method: "POST",
        body: new FormData(form)
      });

      const data = await response.json();
      result.textContent = JSON.stringify(data, null, 2);
    });
  </script>
</body>
</html>
