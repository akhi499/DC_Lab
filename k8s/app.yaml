apiVersion: apps/v1
kind: Deployment
metadata:
  name: raft-a
  labels:
    app: raft-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: raft-a
  template:
    metadata:
      labels:
        app: raft-a
    spec:
      containers:
        - name: raft-a
          image: myapp-backend:latest
          imagePullPolicy: Never
          command: ["python", "raft_node.py", "A"]
          env:
            - name: RUN_ENV
              value: "kubernetes"
          ports:
            - containerPort: 60401
              name: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: raft-a
  labels:
    app: raft-a
spec:
  selector:
    app: raft-a
  ports:
    - name: grpc
      port: 60401
      targetPort: 60401
---
